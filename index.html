<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>광명 통근버스 · 월세 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<style>
:root{--bg:#fff;--fg:#1d1f22;--muted:#6a6e74;--line:#e2e0d8;--accent:#1f6f5b;--soft:#e8f2ee}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.5 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--fg);background:var(--bg);display:flex}
#side{width:360px;max-width:100%;height:100%;overflow:auto;border-right:1px solid var(--line);padding:14px 16px 24px;flex:none}
#map{flex:1;height:100%;min-width:0}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 12px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.row label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;user-select:none}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px;margin:4px 0}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl output{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-width:64px;text-align:right}
input[type=search],select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;width:100%}
#list{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
#list li{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
#list li:hover{background:var(--soft)}
#list b{font-weight:500}#list .m{color:var(--muted)}
.cnt{color:var(--muted);font-size:12px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
.leaflet-popup-content{font:13px/1.45 "Noto Sans KR",system-ui,sans-serif;margin:10px 12px}
.leaflet-popup-content h4{margin:0 0 4px;font-size:14px}.leaflet-popup-content table{border-collapse:collapse;font-size:12px;margin-top:4px;display:block;max-width:100%;overflow-x:auto}
.leaflet-popup-content td{padding:1px 6px 1px 0;white-space:nowrap}.leaflet-popup-content .m{color:var(--muted);font-size:12px}
.leaflet-popup-content a{color:var(--accent)}
.bus{width:22px;height:22px;border-radius:6px;background:#fff;border:2.5px solid var(--c,#333);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.plant{width:34px;height:34px;border-radius:8px;background:#c0392b;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 2px #c0392b,0 2px 6px rgba(0,0,0,.4)}
.pill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--c);color:#fff;border:2px solid #fff;border-radius:999px;padding:2px 7px 2px 3px;font:700 11px/1.2 "Noto Sans KR",system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.pill .t{width:15px;height:15px;border-radius:50%;background:#fff;color:var(--c);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pill small{font-weight:400;opacity:.9}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.leaflet-marker-icon.lbl{background:none;border:0;width:auto!important;height:auto!important}
#handle{display:none}
@media (max-width:760px){
 body{display:block;position:relative}
 #map{position:absolute;inset:0;height:100%}
 #side{position:fixed;left:0;right:0;bottom:0;height:auto;max-height:72vh;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;background:var(--bg);box-shadow:0 -4px 16px rgba(0,0,0,.18);z-index:1000;padding:0 14px 20px;transition:transform .25s ease;overflow:auto;-webkit-overflow-scrolling:touch}
 #side.collapsed{transform:translateY(calc(100% - 58px));overflow:hidden}
 #handle{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px;cursor:pointer;z-index:2}
 #handle b{font-size:15px;font-weight:700}
 #handle::before{content:"";position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#c9c6bd}
 #handle span{font-size:13px;color:var(--accent);font-weight:500;padding:4px 10px;border:1px solid var(--accent);border-radius:999px}
 h1{display:none}.sub{font-size:11px}
 h2{margin:10px 0 4px}
 .ctl{grid-template-columns:1fr auto;margin:2px 0}
 .ctl input[type=range]{height:28px}
 .leaflet-control-zoom{display:none}
 .leaflet-top.leaflet-right{top:8px}
 #list li{padding:8px 10px}
 .bus{width:20px;height:20px;font-size:12px}
 .pill{font-size:12px;padding:3px 8px 3px 3px}
}
</style></head><body>

 <div class="row" style="margin:6px 0">
  <label><input type="checkbox" class="f-asset" value="officetel" checked>오피스텔</label>
  <label><input type="checkbox" class="f-asset" value="villa" checked>연립·다세대</label>
  <label><input type="checkbox" class="f-asset" value="single-house">단독·다가구</label>
 </div>
 <input type="search" id="q" placeholder="동 이름이나 건물명 검색 (예: 철산동, 소하동)">
 <div class="legend"><span><i style="background:#2a9d8f"></i>월세 40만 이하</span><span><i style="background:#e9a23b"></i>40~55만</span><span><i style="background:#d64545"></i>55만 초과</span><span>라벨 = 보증금/월세 (만원). 동그라미 글자: 오=오피스텔, 연=연립·다세대, 다=단독·다가구. 확대하면 가격 라벨, 축소하면 점.</span><span>🚌 정류장 (테두리 색 = 권역) · 🏭 공장</span></div>

</aside>

gu": "동작구", "district": "상도동", "name": "렉스빌(214-197)", "asset": "villa", "lat": 37.495295779820715, "lng": 126.94193438633313, "addr": "서울 동작구 상도동 445", "n": 1, "rent_med": 10, "rent_min": 10, "rent_max": 10, "dep_med": 22000, "area_med": 38.49, "build": 2015, "deals": [{"d": "2026-10-03", "a": 38.49, "f": 2, "dep": 22000, "r": 10}], "km": 7.8}, {"gu": "동작구", "district": "대방동", "name": "미래winners(344-6)", "asset": "villa", "lat": 37.51157187456262, "lng": 126.92636729723128, "addr": "서울 동작구 대방동 344-6", "n": 1, "rent_med": 15, "rent_min": 15, "rent_max": 15, "dep_med": 23400, "area_med": 28.7, "build": 2015, "deals": [{"d": "2026-10-06", "a": 28.7, "f": 3, "dep": 23400, "r": 15}], "km": 8.7}, {"gu": "동작구", "district": "대방동", "name": "더클래스", "asset": "villa", "lat": 37.505236803878944, "lng": 126.92476753516874, "addr": "서울 동작구 대방동 375-5", "n": 1, "rent_med": 20, "rent_min": 20, "rent_max": 20, "dep_med": 23000, "area_med": 29.25, "build": 2018, "deals": [{"d": "2026-10-05", "a": 29.25, "f": 3, "dep": 23000, "r": 20}], "km": 8.0}, {"gu": "동작구", "district": "상도동", "name": "(358-12)", "asset": "villa", "lat": 37.4966222692933, "lng": 126.942358557072, "addr": "서울 동작구 상도동 산 65-42", "n": 1, "rent_med": 60, "rent_min": 60, "rent_max": 60, "dep_med": 10000, "area_med": 43.73, "build": 2003, "deals": [{"d": "2026-10-02", "a": 43.73, "f": 3, "dep": 10000, "r": 60}], "km": 8.0}]</script>
<script>
const ROUTES=JSON.parse(document.getElementById("data-routes").textContent);
const BLDS=JSON.parse(document.getElementById("data-blds").textContent);
const PLANT=[37.4389,126.8885];
const COLORS={"광명":"#c0392b","안양":"#1f6f5b","군포":"#2980b9","시흥":"#8e44ad","부천":"#d35400","서울":"#16a085","인천":"#2c3e50","수원":"#7f8c8d","성남":"#27ae60","고양":"#a0522d","김포":"#b8860b","안산":"#6c5ce7"};
const map=L.map("map",{preferCanvas:true,maxZoom:19}).setView(PLANT,12);
const ofm=(name)=>L.maplibreGL({style:"https://tiles.openfreemap.org/styles/"+name,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · <a href="https://openfreemap.org">OpenFreeMap</a>'});
const base={
 "기본 (OpenFreeMap Liberty)":ofm("liberty"),
 "밝게 (OpenFreeMap Bright)":ofm("bright"),
 "연하게 (OpenFreeMap Positron)":ofm("positron"),
 "위성 (Esri)":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}),
 "OpenStreetMap 래스터 (localhost 전용)":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'})
};
function webgl(){try{const c=document.createElement("canvas");return !!(window.maplibregl&&L.maplibreGL&&(c.getContext("webgl2")||c.getContext("webgl")))}catch(e){return false}}
if(webgl()){ base["기본 (OpenFreeMap Liberty)"].addTo(map); }
else { for(const k of Object.keys(base)) if(k.includes("OpenFreeMap")) delete base[k];
 base["거리 지도 (Esri, 한국 상세 없음)"]=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"});
 base["위성 (Esri)"].addTo(map);
 setTimeout(()=>alert("이 브라우저는 벡터 지도(WebGL)를 지원하지 않아 위성 지도로 대신 표시합니다. 크롬이나 사파리로 열면 일반 지도가 보입니다."),500); }
L.control.layers(base,null,{position:"topright"}).addTo(map);
L.marker(PLANT,{icon:L.divIcon({className:"lbl",html:'<div class="plant">🏭</div>',iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:1000}).addTo(map).bindPopup("<h4>KIA AutoLand 광명</h4><span class='m'>소하동 781-1 · 모든 노선의 종점/기점</span>");

// 권역 칩
const regions=[...new Set(ROUTES.map(r=>r.region))];
const regOn=new Set(["광명","안양","부천","시흥","서울","군포"]);
const regBox=document.getElementById("regions");
for(const rg of regions){const c=document.createElement("span");c.className="chip"+(regOn.has(rg)?"":" off");c.innerHTML=`<i style="background:${COLORS[rg]||"#555"}"></i>${rg}`;
 c.onclick=()=>{regOn.has(rg)?regOn.delete(rg):regOn.add(rg);c.classList.toggle("off",!regOn.has(rg));drawRoutes();};regBox.appendChild(c);}
const checked=cls=>[...document.querySelectorAll("."+cls)].filter(i=>i.checked).map(i=>i.value);

const routeLayer=L.layerGroup().addTo(map);
function drawRoutes(){
 routeLayer.clearLayers(); let n=0;
 const sheets=checked("f-sheet"),kinds=checked("f-kind");
 for(const r of ROUTES){
  if(!sheets.includes(r.sheet)||!kinds.includes(r.kind)||!regOn.has(r.region)||r.line.length<2) continue;
  n++; const col=COLORS[r.region]||"#555";
  const miss=r.missing.length?`<p class="m">위치 미확인 정류장: ${r.missing.join(", ")}</p>`:"";
  const tbl="<table>"+r.stops.map(s=>`<tr><td>${s.time}</td><td>${s.name}${s.lat?"":" <span class='m'>(미확인)</span>"}</td></tr>`).join("")+"</table>";
  const pop=`<h4>${r.sheet} ${r.kind} · ${r.route}</h4><span class="m">${r.region}권 · 정류장 ${r.stops.length}개. 선은 정류장 순서를 이은 것이며 실제 주행 경로가 아닙니다.</span>${tbl}${miss}`;
  L.polyline(r.line,{color:col,weight:3,opacity:.75,dashArray:r.kind==="퇴근"?"6 6":null}).bindPopup(pop,{maxWidth:Math.min(360,innerWidth-50)}).addTo(routeLayer);
  for(const s of r.stops){ if(!s.lat) continue;
   L.marker([s.lat,s.lng],{icon:L.divIcon({className:"lbl",html:`<div class="bus" style="--c:${col}">🚌</div>`,iconSize:[22,22],iconAnchor:[11,11]})})
    .bindPopup(`<h4>${s.name}</h4>${r.sheet} ${r.kind} ${r.route} 노선 · <b>${s.time}</b><br><span class="m">카카오 매칭: ${s.place} (${s.addr||""})</span>`).addTo(routeLayer);
  }
 }
 document.getElementById("rcnt").textContent=`표시 노선 ${n}개 · 1조 출근은 실선, 퇴근은 점선. 선을 누르면 정류장·시각 목록.`;
}
document.querySelectorAll(".f-sheet,.f-kind").forEach(i=>i.addEventListener("change",drawRoutes));

// 건물
const bLayer=L.layerGroup().addTo(map);
const man=v=>v>=10000?(v/10000).toFixed(v%10000?1:0)+"억":v.toLocaleString()+"만";
const colorOf=r=>r<=40?"#2a9d8f":r<=55?"#e9a23b":"#d64545";
const ASSET={officetel:"오피스텔",villa:"연립·다세대","single-house":"단독·다가구"};
const GLYPH={officetel:"오",villa:"연","single-house":"다"};
const short=v=>v>=10000?(v/10000).toFixed(v%10000?1:0)+"억":v>=1000?(v/1000).toFixed(v%1000?1:0)+"천":v+"";
function bIcon(b){
 const c=colorOf(b.rent_med);
 if(map.getZoom()<14) return L.divIcon({className:"lbl",html:`<div class="dot" style="--c:${c}"></div>`,iconSize:[0,0]});
 return L.divIcon({className:"lbl",html:`<div class="pill" style="--c:${c}"><span class="t">${GLYPH[b.asset]}</span>${short(b.dep_med)}<small>/</small>${b.rent_med}만</div>`,iconSize:[0,0]});
}
const isMobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function naverLand(b){
 return isMobile
  ? `https://m.land.naver.com/map/${b.lat}:${b.lng}:16:/OPST:OR:VL:DDDGG/B2`
  : `https://new.land.naver.com/rooms?ms=${b.lat},${b.lng},16&a=OPST:OR:VL:DDDGG&b=B2&e=RETAIL`;
}
function naverUrl(b){return "https://map.naver.com/p/search/"+encodeURIComponent(b.district+" "+b.name);}
function kakaoUrl(b){return "https://map.kakao.com/?q="+encodeURIComponent(b.district+" "+b.name);}
function popup(b){
 const deals="<table>"+b.deals.map(d=>`<tr><td>${d.d}</td><td>${d.a}㎡</td><td>${d.f?d.f+"층":""}</td><td>${man(d.dep)} / ${d.r}만</td></tr>`).join("")+"</table>";
 return `<h4>${b.name}</h4><span class="m">${b.gu} ${b.district} · ${ASSET[b.asset]} · ${b.build?b.build+"년 준공":""} · 공장까지 직선 ${b.km}km</span>
 <div style="margin-top:4px">최근 3개월 월세 계약 <b>${b.n}건</b> · 중위 <b>${man(b.dep_med)} / ${b.rent_med}만</b> (${b.rent_min}~${b.rent_max}만) · 전용 ${b.area_med}㎡</div>${deals}
 <div style="margin-top:6px"><a href="${naverUrl(b)}" target="_blank" rel="noopener">네이버 지도</a> · <a href="${kakaoUrl(b)}" target="_blank" rel="noopener">카카오맵</a> · <a href="${naverLand(b)}" target="_blank" rel="noopener">네이버 부동산 이 위치 월세 매물</a></div>`;
}
let cur=[];
function drawBlds(){
 bLayer.clearLayers();
 const rent=+document.getElementById("f-rent").value,dep=+document.getElementById("f-dep").value,area=+document.getElementById("f-area").value,by=+document.getElementById("f-by").value;
 const assets=checked("f-asset"),q=document.getElementById("q").value.trim();
 document.getElementById("o-rent").textContent=rent+"만";document.getElementById("o-dep").textContent=dep.toLocaleString()+"만";document.getElementById("o-area").textContent=area+"㎡";document.getElementById("o-by").textContent=by+"년";
 cur=BLDS.filter(b=>b.rent_med<=rent&&b.dep_med<=dep&&b.area_med>=area&&(b.build||0)>=by&&assets.includes(b.asset)&&(!q||(b.district+b.name+b.gu).includes(q)));
 for(const b of cur){
  L.marker([b.lat,b.lng],{icon:bIcon(b),zIndexOffset:b.n}).bindPopup(popup(b),{maxWidth:Math.min(380,innerWidth-50)}).addTo(bLayer);
 }
 document.getElementById("bcnt").textContent=`조건에 맞는 건물 ${cur.length}개 (전체 ${BLDS.length}개). 목록은 공장에서 가까운 순 40개.`;
 const list=document.getElementById("list"); list.innerHTML="";
 for(const b of [...cur].sort((a,c)=>a.km-c.km).slice(0,40)){
  const li=document.createElement("li");
  li.innerHTML=`<b>${b.name}</b><span class="num">${man(b.dep_med)} / ${b.rent_med}만</span><span class="m">${b.district} · ${ASSET[b.asset]} · ${b.build||"?"}년 · ${b.n}건</span><span class="m">${b.km}km</span>`;
  li.onclick=()=>{map.flyTo([b.lat,b.lng],16);map.once("moveend",()=>bLayer.eachLayer(l=>{if(l.getLatLng&&l.getLatLng().lat===b.lat&&l.getLatLng().lng===b.lng)l.openPopup();}));};
  list.appendChild(li);
 }
}
document.querySelectorAll("#f-rent,#f-dep,#f-area,#f-by,.f-asset").forEach(i=>i.addEventListener("input",drawBlds));
document.getElementById("q").addEventListener("input",drawBlds);
map.on("zoomend",()=>{const z=map.getZoom();if((z>=14)!==lastBig){lastBig=z>=14;drawBlds();}});let lastBig=map.getZoom()>=14;
drawRoutes(); drawBlds();
// 모바일 바텀시트
const side=document.getElementById("side"),handle=document.getElementById("handle"),hb=document.getElementById("handle-btn");
const mobile=()=>matchMedia("(max-width:760px)").matches;
function setSheet(open){side.classList.toggle("collapsed",!open);hb.textContent=open?"접기":"열기";}
if(mobile()){setSheet(false);}
handle.addEventListener("click",()=>setSheet(side.classList.contains("collapsed")));
map.on("click",()=>{if(mobile())setSheet(false);});
document.getElementById("list").addEventListener("click",()=>{if(mobile())setSheet(false);});
addEventListener("resize",()=>{if(!mobile())side.classList.remove("collapsed");});
</script></body></html>
